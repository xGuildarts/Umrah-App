<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> AL-Maamoun Flights </title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7;--card:#fff;--ink:#12284a;--mut:#5b6b82;--line:#d5dde8;
  --acc:#0b7a75;--bad:#b3261e;--ok:#1e7d3a;--warn:#b45309;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1622;--card:#172335;--ink:#e6edf7;--mut:#93a3ba;--line:#2a3a52;
  --acc:#3fc1b9;--bad:#ff8a80;--ok:#6fdc8c;--warn:#fbbf24
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:15px}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:11px}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
button.sec{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
button.x{background:transparent;color:var(--bad);border-color:transparent;padding:3px 7px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
textarea{width:100%;height:56px;direction:ltr;font-family:Consolas,monospace;font-size:13px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#msg{min-height:24px;margin-top:6px;font-weight:700;font-size:14px}
#msg.ok{color:var(--ok)}#msg.err{color:var(--bad)}#msg.warn{color:var(--warn)}

/* supabase */
#sbcfg{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:8px}
#sbcfg input{width:100%;margin-top:4px;direction:ltr;font-size:13px}
#sb-status{font-size:13px}
#sb-status.ok{color:var(--ok)}#sb-status.err{color:var(--bad)}#sb-status.loading{color:var(--mut)}

/* badge */
.grp-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
  font-size:12px;font-weight:700;background:var(--ok);color:#fff;margin-right:2px}
.grp-badge.warn{background:var(--warn)}
.grp-badge.over{background:var(--bad)}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600;background:var(--bg)}
td.ltr,th.ltr{direction:ltr;text-align:left}
td.ltr{font-family:Arial,sans-serif;font-weight:600}
td.mono{direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:11px;color:var(--mut)}
span.nm{cursor:pointer;border-radius:4px;padding:1px 4px;transition:background .15s}
span.nm:hover{background:var(--line)}
span.nm.copied{background:var(--ok)!important;color:#fff}
.tag-exp{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700}
.tag-ok{background:#dcfce7;color:#166534}
.tag-warn{background:#fef3c7;color:#92400e}
.tag-bad{background:#fee2e2;color:#991b1b}
td.chk{text-align:center}
td.chk input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--acc)}

/* export panel */
.exp-panel{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.exp-panel h4{margin:0 0 8px;font-size:14px}
.col-grid{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
.col-grid label{font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer}

/* undo */
#undo-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;
  display:flex;align-items:center;gap:10px;font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .3s;z-index:99}
#undo-bar.hide{opacity:0;pointer-events:none}
#undo-bar button{background:var(--acc);color:#fff;border:none;padding:4px 11px;border-radius:6px;font-size:13px;font-weight:700}
.hint{color:var(--mut);font-size:13px;margin:0 0 6px}
kbd{background:var(--line);border-radius:4px;padding:1px 5px;font-size:11px}

dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:300px}
dialog::backdrop{background:rgba(0,0,0,.4)}
/* print */
#pa{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap{display:none}
  #pa{display:block;padding:8mm;font-family:Arial,sans-serif;color:#000;direction:ltr}
  #pa h2{margin:0 0 2px;font-size:14px}
  #pa .meta{font-size:11px;margin-bottom:6px;color:#555}
  #pa table{width:100%;font-size:11px;border-collapse:collapse}
  #pa th,#pa td{border:1px solid #000;padding:3px 6px;text-align:left}
  #pa th{background:#eee}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #pa .tag-ok{color:#166534}#pa .tag-warn{color:#92400e}#pa .tag-bad{color:#991b1b}
}
</style>
</head>
<body>
<div class="wrap">
<h1>✈️ كشف مجموعات الطيران — أدريسكا</h1>

<!-- Supabase -->
<div class="card">
  <div class="row" style="justify-content:space-between">
    <strong style="font-size:14px">Supabase</strong>
    <div class="row">
      <span id="sb-status" class="loading">⬤ غير متصل</span>
      <button class="sec" id="sb-refresh" style="font-size:12px;padding:5px 9px">🔄 تحديث</button>
      <button class="sec" id="sb-toggle" style="font-size:12px;padding:5px 9px">إعدادات</button>
    </div>
  </div>
  <div id="sbcfg" style="display:none">
    <div class="row" style="gap:6px">
      <div style="flex:1"><label style="font-size:11px;color:var(--mut)">URL</label><input id="sb-url" dir="ltr" placeholder="https://xxxx.supabase.co"></div>
      <div style="flex:1"><label style="font-size:11px;color:var(--mut)">Anon Key</label><input id="sb-key" type="password" dir="ltr" placeholder="eyJ..."></div>
    </div>
    <div class="row" style="margin-top:7px">
      <button id="sb-save" style="font-size:13px;padding:5px 12px">حفظ والاتصال</button>
      <button class="sec" id="sb-clear" style="font-size:13px;padding:5px 12px">مسح</button>
    </div>
  </div>
</div>

<!-- Groups -->
<div class="card">
  <div class="row">
    <label for="gsel" style="font-size:13px">المجموعة:</label>
    <select id="gsel"></select>
    <span id="gcnt" class="grp-badge">0/50</span>
    <input id="gtrip" placeholder="وجهة الرحلة" style="flex:1;min-width:130px;font-size:13px">
    <input id="gdate" type="date" style="font-size:13px" title="تاريخ الرحلة — بيُستخدم لحساب صلاحية الجواز">
    <button class="sec" id="gnew" style="font-size:13px;padding:6px 10px">+ جديدة</button>
    <button class="sec" id="gren" style="font-size:13px;padding:6px 10px">✏️</button>
    <button class="x" id="gdel">حذف</button>
  </div>
  <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--mut);font-size:13px">💰 أسعار التسكين والحد الأدنى للسداد</summary>
    <div class="row" id="prices" style="margin-top:7px;font-size:12px">
      <label>سنجل <input type="number" min="0" data-room="single" style="width:90px"></label>
      <label>ثنائي <input type="number" min="0" data-room="double" style="width:90px"></label>
      <label>ثلاثي <input type="number" min="0" data-room="triple" style="width:90px"></label>
      <label>رباعي <input type="number" min="0" data-room="quad" style="width:90px"></label>
      <label>خماسي <input type="number" min="0" data-room="quint" style="width:90px"></label>
      <label>الحد الأدنى % <input type="number" min="0" max="100" id="minpct" style="width:65px"></label>
    </div>
  </details>
</div>

<!-- Scanner -->
<div class="card">
  <p class="hint">سكّن الجواز على القارئ — الاسم والبيانات بتتسجل تلقائي. &nbsp;<kbd>F2</kbd> مجموعة جديدة &nbsp;<kbd>F3</kbd> طباعة &nbsp;<kbd>Ctrl+Z</kbd> تراجع</p>
  <textarea id="box" autofocus placeholder="P<EGY..."></textarea>
  <div id="msg" role="status"></div>
  <details style="margin-top:7px">
    <summary style="cursor:pointer;color:var(--mut);font-size:13px">إضافة يدوية</summary>
    <div class="row" style="margin-top:7px">
      <input id="msur" dir="ltr" placeholder="Surname" style="flex:1">
      <input id="mgiv" dir="ltr" placeholder="Given Names" style="flex:1">
      <input id="mpno" dir="ltr" placeholder="Passport No." style="width:120px">
      <input id="mdob" type="date" style="font-size:13px" title="تاريخ الميلاد">
      <input id="mexp" type="date" style="font-size:13px" title="تاريخ انتهاء الجواز">
      <select id="msex" style="font-size:13px;padding:6px 8px"><option value="">الجنس</option><option value="M">ذكر M</option><option value="F">أنثى F</option></select>
      <button id="madd">إضافة</button>
    </div>
  </details>
</div>

<!-- List -->
<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">
    <strong id="ttl" style="font-size:14px"></strong>
    <div class="row">
      <label style="font-size:12px;color:var(--mut)">عرض الاسم:</label>
      <select id="vmode" style="font-size:12px;padding:4px 7px">
        <option value="full">كامل</option>
        <option value="flight">ترتيب طيران</option>
        <option value="mrz">MRZ</option>
      </select>
      <label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="show-details" checked> بيانات MRZ</label>
    </div>
  </div>

  <div class="row" style="margin-bottom:8px"><label style="font-size:12px;color:var(--mut)">فلتر:</label>
    <select id="flt" style="font-size:12px;padding:4px 7px"><option value="all">الكل</option><option value="issues">أي نواقص</option><option value="docs">ناقص أوراق</option><option value="pass">جواز فيه مشكلة</option><option value="pay">مطلوب سداد</option><option value="norev">🔍 لسه ماتراجعش</option><option value="room">🛏️ مشاكل غرف</option><option value="noroom">بدون رقم غرفة</option><option value="haspass">🛂 الجواز معانا</option><option value="nopass">الجواز مع العميل</option></select>
    <span id="fltn" class="hint" style="margin:0"></span>
    <label style="font-size:12px"><input type="checkbox" id="sortroom" checked> ترتيب بالغرفة</label>
    <button class="sec" id="autorm" style="font-size:12px;padding:4px 9px">🛏️ تسكين تلقائي</button></div>
  <div id="sumbar" style="font-size:13px;font-weight:700;margin-bottom:8px"></div>
  <div id="roomsum" class="hint"></div>
  <div class="tbl-wrap"><table id="main-table">
    <thead id="thead-row"></thead>
    <tbody id="tb"></tbody>
  </table></div>
  <p id="empty" class="hint" style="margin-top:8px;display:none">المجموعة فاضية.</p>

  <!-- Export panel -->
  <div class="exp-panel">
    <h4>🖨️ طباعة / تصدير — اختار الأعمدة <span style="font-weight:400;font-size:12px;color:var(--mut)">(بيطبع اللي ظاهر حسب الفلتر)</span></h4>
    <div class="col-grid" id="col-picks">
      <label><input type="checkbox" data-col="num" checked disabled> # </label>
      <label><input type="checkbox" data-col="name" checked> الاسم</label>
      <label><input type="checkbox" data-col="pno"> رقم الجواز</label>
      <label><input type="checkbox" data-col="nat"> الجنسية</label>
      <label><input type="checkbox" data-col="sex"> الجنس</label>
      <label><input type="checkbox" data-col="dob"> تاريخ الميلاد</label>
      <label><input type="checkbox" data-col="exp"> انتهاء الجواز</label>
      <label><input type="checkbox" data-col="exp-status"> حالة الجواز</label>
      <label><input type="checkbox" data-col="photo"> صورة بيضاء</label>
      <label><input type="checkbox" data-col="passport-doc"> صورة جواز</label>
      <label><input type="checkbox" data-col="tajneed"> موقف التجنيد</label>
      <label><input type="checkbox" data-col="pay" checked> 💰 السداد</label>
      <label><input type="checkbox" data-col="missing" checked> النواقص</label>
      <label><input type="checkbox" data-col="haspass"> 🛂 الجواز معانا؟</label>
      <label><input type="checkbox" data-col="rno" checked> 🛏️ رقم الغرفة</label>
    </div>
    <div class="row">
      <label style="font-size:12px;color:var(--mut)">الاسم بـ:</label>
      <select id="pmode" style="font-size:12px;padding:4px 7px">
        <option value="full">كامل مدمج</option>
        <option value="flight">ترتيب طيران</option>
        <option value="mrz">MRZ</option>
        <option value="cols">عمودين</option>
      </select>
      <button id="prt">🖨️ طباعة</button>
      <button class="sec" id="xls">⬇️ Excel / CSV</button>
      <button class="sec" id="rml">🏨 كشف تسكين للفندق</button>
    </div>
  </div>
</div>
</div>

<dialog id="paydlg">
  <h4 id="pay-ttl" style="margin:0 0 8px"></h4>
  <div id="pay-list" style="margin-bottom:8px"></div>
  <div class="row"><input id="pay-amt" type="number" placeholder="مبلغ الدفعة" style="width:110px"><input id="pay-date" type="date" style="font-size:13px"><button id="pay-add">+ إضافة</button></div>
  <label style="font-size:12px;display:block;margin-top:6px"><input type="checkbox" id="pay-split"> توزيع الدفعة على كل ساكني الغرفة</label>
  <label style="font-size:12px;display:block;margin-top:6px">سعر خاص (طفل / خصم) <input id="pay-custom" type="number" min="0" style="width:90px"></label>
  <div class="row" style="margin-top:8px;justify-content:flex-end"><button class="sec" id="pay-close">إغلاق</button></div>
</dialog>
<div id="undo-bar" class="hide">
  <span id="undo-msg"></span>
  <button id="undo-btn">↩ تراجع</button>
</div>
<div id="pa"></div>

<script>
/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
var $=function(id){return document.getElementById(id)};
function newId(){return Date.now()*1000+Math.floor(Math.random()*1000)}
var CUR='EGP';
var CAP={single:1,double:2,triple:3,quad:4,quint:5};
function ageAt(dob,ref){if(!dob)return null;var a=new Date(dob),b=ref?new Date(ref):new Date(),y=b.getFullYear()-a.getFullYear();if(b.getMonth()<a.getMonth()||(b.getMonth()===a.getMonth()&&b.getDate()<a.getDate()))y--;return y}
function isInf(p,g){var a=ageAt(p.dob,g.date);return a!==null&&a<2}
function longNm(p){return!!p.mrz&&p.mrz.split('\n')[0].slice(5).replace(/<+$/,'').length>=38}
function okName(x){return!x||/^[A-Z][A-Z '\-]*$/.test(x)}
function nextRoom(){var mx=0;list().forEach(function(p){var n=parseInt(p.rno);if(n>mx)mx=n});return String(mx+1)}
function roomLbl(k){var r=ROOMS.filter(function(x){return x[0]===k})[0];return r?r[1]:'غير محدد'}
function roomStats(g){var m=roomMap(g),st={};Object.keys(m).forEach(function(k){var mem=m[k],ty=mem[0].room||'?',n=mem.filter(function(x){return!isInf(x,g)}).length;st[ty]=st[ty]||{r:0,inc:0};st[ty].r++;if(CAP[ty]&&n<CAP[ty])st[ty].inc++});return st}
function suggestRoom(p,g){var m=roomMap(g),best='';Object.keys(m).some(function(k){var mem=m[k];
  if(mem.some(function(x){return x.fam})||mem[0].room!==p.room)return false;
  if(mem.filter(function(x){return!isInf(x,g)}).length>=CAP[p.room])return false;
  if(mem.some(function(x){return x.sex&&p.sex&&x.sex!==p.sex}))return false;best=k;return true});return best}
function sumPays(p){return(p.pays||[]).reduce(function(a,x){return a+(+x.a||0)},0)}
function paidOf(p){return(p.pays&&p.pays.length)?sumPays(p):(+p.paid||0)}
function roomMap(g){var m={};S.people.forEach(function(p){if(p.g===g.id&&p.rno)(m[p.rno]=m[p.rno]||[]).push(p)});return m}
function roomIssue(p,g){
  if(!p.rno)return'';
  var mem=roomMap(g)[p.rno]||[],ty={},sx={},fam=false,msg=[];
  mem.forEach(function(x){if(x.room)ty[x.room]=1;if(x.sex)sx[x.sex]=1;if(x.fam)fam=true});
  var tk=Object.keys(ty);
  if(tk.length>1)msg.push('تسكين مختلف في نفس الغرفة');
  else if(tk.length){var c=CAP[tk[0]],n=mem.filter(function(x){return!isInf(x,g)}).length;if(n>c)msg.push('زيادة '+(n-c));else if(n<c)msg.push('ناقصة '+(c-n))}
  if(Object.keys(sx).length>1&&!fam)msg.push('رجال وسيدات مع بعض');
  return msg.join(' + ');
}
var ROOMS=[['single','سنجل'],['double','ثنائي'],['triple','ثلاثي'],['quad','رباعي'],['quint','خماسي']];
function payInfo(p,g){
  var tot=+(p.custom||(g.pr||{})[p.room]||0),paid=paidOf(p),pct=(g.minPct==null||g.minPct==='')?50:+g.minPct;
  if(tot>0){var need=Math.max(0,Math.ceil(tot*pct/100-paid));return{auto:true,tot:tot,paid:paid,rem:Math.max(0,tot-paid),need:need,due:need>0,amt:need}}
  return{auto:false,tot:0,paid:paid,rem:0,need:0,due:!!p.payDue,amt:+p.payAmt||0};
}
function missing(p,g){
  var m=[];if(!p.photo)m.push('صورة');if(!p.passportDoc)m.push('جواز');if(!p.tajneed&&p.sex!=='F')m.push('تجنيد');
  var c=expStatus(p.exp,g.date).cls;if(c==='tag-bad')m.push('جواز منتهي');else if(c==='tag-warn')m.push('جواز أقل من سنة');
  if(longNm(p)&&!p.rev)m.push('اسم طويل — ممكن مقصوص');
  var ri=roomIssue(p,g);if(ri)m.push('غرفة '+p.rno+': '+ri);
  var pi=payInfo(p,g);if(pi.due)m.push('سداد'+(pi.amt?' '+pi.amt:''));
  return m;
}
function fltOK(p,g,f){
  if(f==='issues')return missing(p,g).length>0;
  if(f==='docs')return!p.photo||!p.passportDoc||(!p.tajneed&&p.sex!=='F');
  if(f==='pass')return expStatus(p.exp,g.date).cls!=='';
  if(f==='pay')return payInfo(p,g).due;
  if(f==='norev')return!p.rev;
  if(f==='room')return!!roomIssue(p,g);
  if(f==='noroom')return!p.rno;
  if(f==='haspass')return!!p.hasPass;
  if(f==='nopass')return!p.hasPass;
  return true;
}
function viewList(){var g=grp(),f=$('flt').value,r=list().filter(function(p){return fltOK(p,g,f)});
  if($('sortroom').checked)r=r.map(function(p,i){return[p,i]}).sort(function(a,b){var x=parseInt(a[0].rno),y=parseInt(b[0].rno);x=isNaN(x)?1e9:x;y=isNaN(y)?1e9:y;return x-y||a[1]-b[1]}).map(function(a){return a[0]});
  return r}
// MRZ check digit (ICAO 7-3-1)
function chkD(s,c){var w=[7,3,1],t=0;for(var i=0;i<s.length;i++){var ch=s[i],v=ch==='<'?0:/\d/.test(ch)?+ch:ch.charCodeAt(0)-55;t+=v*w[i%3]}return String(t%10)===c}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function say(t,c){$('msg').textContent=t;$('msg').className=c||''}
function beep(f){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();setTimeout(function(){o.stop();a.close()},140)}catch(e){}}

/* ══════════════════════════════════════════
   MRZ DATE HELPERS
══════════════════════════════════════════ */
// YYMMDD → YYYY-MM-DD  (pivot: >30 = 1900s, else 2000s)
function mrzDate(s,kind){
  if(!s||s.replace(/</g,'').length<6)return'';
  var yy=parseInt(s.slice(0,2)),mm=s.slice(2,4),dd=s.slice(4,6);
  var yyyy=2000+yy;if(kind==='dob'&&yyyy>new Date().getFullYear())yyyy-=100; // expiry دايماً 20xx
  return yyyy+'-'+mm+'-'+dd;
}
function fmtDate(iso){
  if(!iso)return'';
  var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];
}
// months between two ISO dates
function monthsDiff(from,to){
  if(!from||!to)return null;
  var a=new Date(from),b=new Date(to);
  return(b-a)/2629800000;
}
function expStatus(expIso,tripIso){
  if(!expIso)return{cls:'',label:''};
  var now=new Date().toISOString().slice(0,10);
  if(expIso<now)return{cls:'tag-bad',label:'منتهي ✗'};
  if(tripIso&&expIso<tripIso)return{cls:'tag-bad',label:'ينتهي قبل السفر ✗'};
  var ref=tripIso||now;
  var months=monthsDiff(ref,expIso);
  if(months<12)return{cls:'tag-warn',label:'< سنة ⚠️'};
  return{cls:'tag-ok',label:'سارية ✓'};
}

function nameFull(p){return(p.sur+' '+p.giv).trim()}
function nameFlight(p){return(p.giv+' '+p.sur).trim()}
function nameMRZ(p){return(p.sur||'').replace(/ /g,'<')+'<<'+(p.giv||'').replace(/ /g,'<')}
function nameByMode(p,mode){
  if(mode==='flight')return nameFlight(p);
  if(mode==='mrz')return nameMRZ(p);
  return nameFull(p);
}

/* ══════════════════════════════════════════
   MRZ PARSER
══════════════════════════════════════════ */
function parse(l1,l2){
  var n=l1.slice(5).split('<<');
  var nat=l2.slice(10,13).replace(/</g,'');
  // line2: pno(0-8) check(9) nat(10-12) dob(13-18) check(19) sex(20) exp(21-26) check(27)
  var dob=mrzDate(l2.slice(13,19),'dob');
  var sex=l2.slice(20,21);
  var exp=mrzDate(l2.slice(21,27));
  return{
    sur:n[0].replace(/</g,' ').trim(),
    giv:(n[1]||'').replace(/</g,' ').trim(),
    pno:l2.slice(0,9).replace(/</g,''),
    nat:nat,sex:sex,dob:dob,exp:exp,
    photo:false,passportDoc:false,tajneed:false,hasPass:true
  };
}
function extractLines(raw){
  var s=raw.toUpperCase();
  if(s.indexOf('|')>=0){
    var parts=s.split('|'),l1='',l2='';
    for(var i=0;i<parts.length;i++){
      var p=parts[i].replace(/[^A-Z0-9<]/g,'');
      if(!l1&&p.length>=44&&p.slice(0,2)==='P<'){l1=p.slice(0,44)}
      else if(l1&&!l2&&p.length>=9){l2=p.slice(0,44)}
    }
    if(l1&&l2)return{l1:l1,l2:l2};
  }
  var lines=s.split(/[\r\n]+/).map(function(x){return x.replace(/[^A-Z0-9<]/g,'')}).filter(function(x){return x.length>=9});
  var li=lines.findIndex(function(x){return x.slice(0,2)==='P<'&&x.length>=44});
  if(li>=0&&lines[li+1]&&lines[li+1].length>=9)return{l1:lines[li].slice(0,44),l2:lines[li+1].slice(0,44)};
  var clean=s.replace(/[^A-Z0-9<]/g,'');
  var idx=clean.indexOf('P<');
  if(idx>=0&&clean.length-idx>=88)return{l1:clean.slice(idx,idx+44),l2:clean.slice(idx+44,idx+88)};
  return null;
}

/* ══════════════════════════════════════════
   ADD PERSON
══════════════════════════════════════════ */
async function addPerson(p){
  if(!p.sur&&!p.giv){say('مقدرتش أقرا الاسم — جرّب تاني.','err');beep(200);return false}
  var dup=p.pno?S.people.find(function(x){return x.pno&&x.pno===p.pno}):null;
  if(dup){
    var dg=S.groups.find(function(g){return g.id===dup.g});
    say('⚠️ الجواز متسجل في: '+(dg?dg.name:'مجموعة تانية')+' — '+nameFull(dup),'err');
    beep(200);return false;
  }
  var nd=(p.dob&&!dup)?S.people.find(function(x){return x.dob===p.dob&&nameFull(x)===nameFull(p)}):null;
  if(nd&&!confirm('⚠️ نفس الاسم وتاريخ الميلاد متسجل قبل كده (جواز '+(nd.pno||'؟')+'). تضيفه برضو؟')){say('اتلغى — متكرر.','warn');beep(200);return false}
  p.id=newId();p.g=grp().id;
  S.people.push(p);save();render();
  // warn expiry
  var g=grp();
  var st=expStatus(p.exp,g.date);
  if(st.cls==='tag-bad')say('✓ '+nameFull(p)+' — ⚠️ الجواز منتهي!','warn');
  else if(st.cls==='tag-warn')say('✓ '+nameFull(p)+' — ⚠️ الجواز أقل من سنة','warn');
  else say('✓ '+nameFull(p),'ok');
  beep(st.cls?200:880);
  await sbSavePerson(p);
  return true;
}

/* ══════════════════════════════════════════
   SCANNER
══════════════════════════════════════════ */
var scanTimer,box=$('box');
function scan(){
  var raw=box.value;if(!raw.trim())return;
  var lines=extractLines(raw);if(!lines)return;
  var l2=lines.l2;
  if(!(chkD(l2.slice(0,9),l2[9])&&chkD(l2.slice(13,19),l2[19])&&chkD(l2.slice(21,27),l2[27])&&chkD(l2.slice(0,10)+l2.slice(13,20)+l2.slice(21,43),l2[43])&&!/\d/.test(lines.l1.slice(5)))){say('❌ القراءة فيها غلط (check digit أو رقم جوه الاسم) — سكّن الجواز تاني أو ضيفه يدوي.','err');beep(200);box.value='';box.focus();return}
  var p=parse(lines.l1,lines.l2);p.mrz=lines.l1+'\n'+lines.l2;
  box.value='';addPerson(p);box.focus();
}
box.addEventListener('input',function(){clearTimeout(scanTimer);scanTimer=setTimeout(scan,300)});
box.addEventListener('keydown',function(e){
  if(e.key==='Enter'){setTimeout(function(){
    var raw=box.value.trim();
    if(!raw)return;
    if(extractLines(raw))scan();
    else{say('القراءة ناقصة — سكّن الجواز تاني.','err');beep(200);box.value='';box.focus()}
  },200)}
});

/* ══════════════════════════════════════════
   EXPORT HELPERS
══════════════════════════════════════════ */
function getSelectedCols(){
  var cols=[];
  document.querySelectorAll('#col-picks input[data-col]').forEach(function(cb){
    if(cb.checked)cols.push(cb.dataset.col);
  });
  return cols;
}
function colLabel(col){
  var map={num:'#',name:'Name',pno:'Passport No.',nat:'Nationality',sex:'Sex',
    dob:'Date of Birth',exp:'Passport Expiry','exp-status':'Status',
    pay:'Payment',haspass:'Passport Held',rno:'Room',missing:'Missing',photo:'Photo (White BG)',  'passport-doc':'Passport Copy',tajneed:'Military Status'};
  return map[col]||col;
}
function colValue(p,col,mode,tripDate){
  if(col==='num')return'';
  if(col==='name'){
    if(mode==='cols')return p.sur+' | '+p.giv;
    return nameByMode(p,mode);
  }
  if(col==='pno')return p.pno||'';
  if(col==='nat')return p.nat||'';
  if(col==='sex')return p.sex||'';
  if(col==='dob')return fmtDate(p.dob);
  if(col==='exp')return fmtDate(p.exp);
  if(col==='exp-status'){var st=expStatus(p.exp,tripDate);return st.label.replace(/[✓✗⚠️]/g,'').trim()}
  if(col==='pay'){var pi=payInfo(p,grp());return pi.due?('مطلوب سداد — '+pi.amt+' '+CUR+(pi.auto?' (مدفوع '+pi.paid+' / '+pi.tot+')':'')):(pi.auto?'مسدد '+pi.paid+' / '+pi.tot:'')}
  if(col==='rno')return p.rno?(p.rno+(p.fam?' (family)':'')):'';
  if(col==='haspass')return p.hasPass?'معانا':'مع العميل';
  if(col==='missing')return missing(p,grp()).join('، ');
  if(col==='photo')return p.photo?'✓':'✗';
  if(col==='passport-doc')return p.passportDoc?'✓':'✗';
  if(col==='tajneed')return p.tajneed?'نعم':'لا';
  return '';
}

/* ══════════════════════════════════════════
   PRINT
══════════════════════════════════════════ */
$('prt').onclick=function(){
  var l=viewList();if(!l.length){alert('مفيش أفراد مطابقين للفلتر.');return}
  var cols=getSelectedCols(),mode=$('pmode').value,g=grp();
  var date=new Date().toLocaleDateString('en-GB');
  var meta='Passengers: '+l.length+($('flt').value!=='all'?' | Filter: '+$('flt').selectedOptions[0].text:'')+(g.trip?' | '+g.trip:'')+(g.date?' | Flight: '+fmtDate(g.date):'');

  // summary counts
  var expWarn=l.filter(function(p){var s=expStatus(p.exp,g.date);return s.cls==='tag-warn'}).length;
  var expBad=l.filter(function(p){var s=expStatus(p.exp,g.date);return s.cls==='tag-bad'}).length;
  var noPhoto=l.filter(function(p){return!p.photo}).length;
  var noPass=l.filter(function(p){return!p.passportDoc}).length;
  var noTaj=l.filter(function(p){return!p.tajneed}).length;
  var summary='';
  if(expBad)summary+='<span style="color:#991b1b">⚠ جوازات منتهية: '+expBad+'</span> &nbsp;';
  if(expWarn)summary+='<span style="color:#92400e">⚠ أقل من سنة: '+expWarn+'</span> &nbsp;';
  if(cols.includes('photo'))summary+='ناقص صورة: '+noPhoto+' &nbsp;';
  if(cols.includes('passport-doc'))summary+='ناقص جواز: '+noPass+' &nbsp;';
  if(cols.includes('tajneed'))summary+='بدون موقف تجنيد: '+noTaj+' &nbsp;';
  var pays=l.filter(function(p){return payInfo(p,g).due}),ptot=pays.reduce(function(a,p){return a+payInfo(p,g).amt},0);
  if(cols.includes('pay')&&pays.length)summary+='<b style="color:#991b1b">💰 مطلوب سداد: '+pays.length+(ptot?' — '+ptot+' '+CUR:'')+'</b>';

  var thead='<tr>';
  cols.forEach(function(c){
    if(c==='name'&&mode==='cols'){thead+='<th>Surname</th><th>Given Names</th>'}
    else thead+='<th>'+esc(colLabel(c))+'</th>';
  });
  thead+='</tr>';

  var tbody='';
  l.forEach(function(p,i){
    tbody+='<tr'+(payInfo(p,g).due&&cols.includes('pay')?' style="background:#fee2e2"':'')+'>';
    cols.forEach(function(c){
      if(c==='num'){tbody+='<td>'+(i+1)+'</td>'}
      else if(c==='name'&&mode==='cols'){tbody+='<td>'+esc(p.sur)+'</td><td>'+esc(p.giv)+'</td>'}
      else if(c==='exp-status'){var st=expStatus(p.exp,g.date);tbody+='<td class="'+st.cls+'">'+esc(st.label)+'</td>'}
      else{tbody+='<td>'+esc(colValue(p,c,mode,g.date))+'</td>'}
    });
    tbody+='</tr>';
  });

  $('pa').innerHTML='<h2>'+esc(g.name)+'</h2>'
    +'<div class="meta">'+meta+' &nbsp;|&nbsp; Printed: '+date+'</div>'
    +(summary?'<div style="margin-bottom:6px;font-size:11px">'+summary+'</div>':'')
    +'<table><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>';
  window.print();
};

/* ══════════════════════════════════════════
   CSV EXPORT
══════════════════════════════════════════ */
$('xls').onclick=function(){
  var l=viewList();if(!l.length){alert('مفيش أفراد مطابقين للفلتر.');return}
  var cols=getSelectedCols(),mode=$('pmode').value,g=grp();
  var rows=[];
  var hdr=[];
  cols.forEach(function(c){
    if(c==='name'&&mode==='cols'){hdr.push('Surname','Given Names')}
    else hdr.push(colLabel(c));
  });
  rows.push(hdr);
  l.forEach(function(p,i){
    var row=[];
    cols.forEach(function(c){
      if(c==='num')row.push(i+1);
      else if(c==='name'&&mode==='cols'){row.push(p.sur);row.push(p.giv)}
      else row.push(colValue(p,c,mode,g.date));
    });
    rows.push(row);
  });
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=g.name.replace(/\s/g,'_')+'_'+(g.date||new Date().toISOString().slice(0,10))+'.csv';
  a.click();URL.revokeObjectURL(a.href);
};

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */

  var g=grp(),l=list(),mode=$('vmode').value,showDet=$('show-details').checked;
  // groups
  $('gsel').innerHTML=S.groups.map(function(x){
    var c=S.people.filter(function(p){return p.g===x.id}).length;
    return'<option value="'+x.id+'"'+(x.id===g.id?' selected':'')+'>'+esc(x.name)+' ('+c+')</option>'
  }).join('');

  $('gdate').value=g.date||'';$('gdate').style.borderColor=(!g.date&&l.length)?'var(--warn)':'';

  var expWarn=l.filter(function(p){var s=expStatus(p.exp,g.date);return s.cls!==''}).length;
  var nB=l.filter(function(p){return expStatus(p.exp,g.date).cls==='tag-bad'}).length,nDoc=l.filter(function(p){return!p.photo||!p.passportDoc}).length,pays=l.filter(function(p){return payInfo(p,g).due}),tot=pays.reduce(function(a,p){return a+payInfo(p,g).amt},0);
  $('sumbar').innerHTML=(l.length?((nB?'<span style="color:var(--bad)">⛔ جوازات فيها مشكلة: '+nB+'</span> &nbsp;':'')+(nDoc?'<span style="color:var(--warn)">📎 ناقص أوراق: '+nDoc+'</span> &nbsp;':'')+(pays.length?'<span style="color:var(--bad)">💰 مطلوب سداد: '+pays.length+(tot?' — '+tot.toLocaleString('en')+' '+CUR:'')+'</span>':'')||'<span style="color:var(--ok)">✓ مفيش ملاحظات</span>')+' &nbsp;<span style="color:var(--mut)">🛂 الجواز معانا: '+l.filter(function(p){return p.hasPass}).length+'/'+l.length+'</span>'+(!g.date?' &nbsp;<span style="color:var(--warn)">📅 حدد تاريخ الرحلة عشان فحص الجواز يبقى دقيق</span>':'')+(function(){var m=roomMap(g),n=0;Object.keys(m).forEach(function(k){if(roomIssue(m[k][0],g))n++});return n?' &nbsp;<span style="color:var(--warn)">🛏️ غرف فيها ملاحظات: '+n+'</span>':''})():'');
  // thead
  var opts=S.groups.map(function(x){return'<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join('');
  $('thead-row').innerHTML='<tr>'
    +'<th style="width:30px">#</th>'

    +(showDet?'<th class="ltr">Passport No.</th><th>الجنسية</th><th>الجنس</th><th class="ltr">الميلاد</th><th class="ltr">انتهاء الجواز</th><th>الحالة</th>':'')
    +'<th style="width:30px" title="صورة خلفية بيضاء">📷</th>'
    +'<th style="width:30px" title="صورة جواز">🪪</th>'
    +'<th style="width:30px" title="موقف التجنيد">🎖️</th>'
    +'<th style="width:30px" title="الجواز الأصلي معانا">🛂</th>'
    +'<th style="width:30px" title="الاسم اتراجع مع الجواز">🔍</th>'
